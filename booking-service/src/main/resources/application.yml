server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/bookingdb
    username: ${POSTGRES_USER:bookinguser}
    password: ${POSTGRES_PASSWORD:bookingpass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps JsonDeserializer so a malformed/unparseable record becomes a catchable
      # DeserializationException that DefaultErrorHandler can route through the normal
      # retry-then-DLT path, instead of a raw SerializationException thrown at Kafka's poll()
      # level — which bypasses retry backoff entirely and can spin a consumer thread at CPU
      # speed on a single poison-pill record. Found live: this service's first-ever
      # notification-cg consumer, starting at auto-offset-reset=earliest, hit a leftover
      # headerless test message on booking.confirmed (from Sprint 2's manual
      # kafka-console-producer testing) and spun to 2.5M+ log lines / a 19GB log file in under
      # 10 seconds before this fix.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.toyrental.*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/toyrental}

couchbase:
  connection-string: ${COUCHBASE_CONNECTION_STRING:couchbase://localhost}
  username: ${COUCHBASE_USERNAME:Administrator}
  password: ${COUCHBASE_PASSWORD:password}
  bucket:
    reports: monthly-reports

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: toy-rental-reports

wiremock:
  base-url: ${WIREMOCK_BASE_URL:http://localhost:9090}

feign:
  toy-service:
    url: ${TOY_SERVICE_URL:http://localhost:8081}

overdue-check:
  initial-delay-ms: ${OVERDUE_CHECK_INITIAL_DELAY_MS:30000}
  interval-ms: ${OVERDUE_CHECK_INTERVAL_MS:21600000}

resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      razorpay:
        maxAttempts: 3
        waitDuration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} correlationId=%X{correlationId} - %msg%n"
  level:
    com.toyrental: DEBUG
    org.springframework.kafka: INFO
