server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/bookingdb
    username: ${POSTGRES_USER:bookinguser}
    password: ${POSTGRES_PASSWORD:bookingpass}
    hikari:
      # Raised 10 -> 30 (matches CLAUDE.md's target). At 10, a burst of concurrent bookings
      # plus the login herd (before bottleneck #1's fix) exhausted the pool; callers then
      # queued up to connection-timeout. See learning/perf-analysis-booking-latency.md (#2).
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  cloud:
    openfeign:
      httpclient:
        # feign-hc5 on the classpath switches Feign to a pooled Apache HttpClient 5.
        max-connections: 200
        max-connections-per-route: 50
        # Recycle idle connections after 30s. Without a TTL, a pooled keep-alive connection
        # stays pinned to whichever toy-service pod kube-proxy (L4) first routed it to, so
        # one replica takes all the internal traffic. A short TTL forces re-connect ->
        # re-balance. See learning/perf-analysis-pod-load-imbalance.md (bottleneck #3).
        time-to-live: 30
        time-to-live-unit: seconds
      client:
        config:
          default:
            # Fail fast instead of Feign's ~10s connect / 60s read defaults. A slow
            # toy-service call otherwise stalls a booking while it holds the pessimistic
            # overlap lock + a DB connection (bottleneck #2).
            connect-timeout: 1000
            read-timeout: 3000
            logger-level: basic
          toy-service:
            connect-timeout: 1000
            read-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Applies to every @KafkaListener in this service (one shared container factory,
      # see KafkaConsumerConfig) — all three consumer groups here (notification-cg,
      # booking-internal-cg, report-cg) share this same concurrency, not independently
      # tunable per group without splitting them onto separate container factories.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}
      # Continues the producer's trace into these consumers' spans instead of starting a
      # fresh, disconnected trace — otherwise a booking-confirmation trace stops dead at
      # the Kafka boundary in Zipkin.
      observation-enabled: true
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps JsonDeserializer so a malformed/unparseable record becomes a catchable
      # DeserializationException that DefaultErrorHandler can route through the normal
      # retry-then-DLT path, instead of a raw SerializationException thrown at Kafka's poll()
      # level — which bypasses retry backoff entirely and can spin a consumer thread at CPU
      # speed on a single poison-pill record. Found live: this service's first-ever
      # notification-cg consumer, starting at auto-offset-reset=earliest, hit a leftover
      # headerless test message on booking.confirmed (from Sprint 2's manual
      # kafka-console-producer testing) and spun to 2.5M+ log lines / a 19GB log file in under
      # 10 seconds before this fix.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.toyrental.*"

# Dev-only default credentials, matching this project's established pattern elsewhere
# (see application.yml's other ${...:default} fallbacks) — override via env vars for
# anything beyond local dev. Checked by AdminAuthService; not stored anywhere, since
# admin is a single configured identity, not a customers-table row.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

security:
  bcrypt:
    # Work factor for password hashing/verification. 10 (the default) is correct for a real
    # deployment. Lower it ONLY for the load-test env to match the pod's ~1 vCPU budget —
    # concurrent logins are un-parallelisable CPU and were pushing login p99 past the client
    # timeout (learning/bottleneck-faced-resolved.md #1). If lowered, the seeded customer
    # rows must be re-hashed at the same cost (loadtest/seed_loadtest_customers.sql).
    strength: ${BCRYPT_STRENGTH:10}

couchbase:
  connection-string: ${COUCHBASE_CONNECTION_STRING:couchbase://localhost}
  username: ${COUCHBASE_USERNAME:Administrator}
  password: ${COUCHBASE_PASSWORD:password}
  bucket:
    reports: monthly-reports

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: toy-rental-reports

wiremock:
  base-url: ${WIREMOCK_BASE_URL:http://localhost:9090}

feign:
  toy-service:
    url: ${TOY_SERVICE_URL:http://localhost:8081}

overdue-check:
  initial-delay-ms: ${OVERDUE_CHECK_INITIAL_DELAY_MS:30000}
  interval-ms: ${OVERDUE_CHECK_INTERVAL_MS:21600000}

resilience4j:
  circuitbreaker:
    instances:
      razorpay:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      razorpay:
        maxAttempts: 3
        waitDuration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} correlationId=%X{correlationId} traceId=%X{traceId} spanId=%X{spanId} - %msg%n"
  level:
    com.toyrental: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: INFO
