apiVersion: v1
kind: Secret
metadata:
  name: booking-service-secret
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_PASSWORD: bookingpass
  COUCHBASE_PASSWORD: password
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin123

---
# Applies to every @KafkaListener in this service (one shared container factory) —
# all three consumer groups here (notification-cg, booking-internal-cg, report-cg)
# share this same concurrency value, not independently tunable per group.
apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
data:
  KAFKA_LISTENER_CONCURRENCY: "1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: booking-service
          image: toyrental/booking-service:1.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_HOST
              value: postgres.infra.svc.cluster.local
            - name: POSTGRES_USER
              value: bookinguser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: POSTGRES_PASSWORD
            - name: COUCHBASE_CONNECTION_STRING
              value: couchbase://couchbase.infra.svc.cluster.local
            - name: COUCHBASE_USERNAME
              value: Administrator
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: COUCHBASE_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.infra.svc.cluster.local:9092
            - name: KAFKA_LISTENER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: booking-service-config
                  key: KAFKA_LISTENER_CONCURRENCY
            - name: MINIO_ENDPOINT
              value: http://minio.infra.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: MINIO_SECRET_KEY
            - name: WIREMOCK_BASE_URL
              value: http://wiremock.infra.svc.cluster.local:9090
            - name: TOY_SERVICE_URL
              value: http://toy-service.toy-rental.svc.cluster.local:8081
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: ADMIN_PASSWORD
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-log-level
                  key: LOG_LEVEL
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-jvm-opts
                  key: JAVA_TOOL_OPTIONS
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 150
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 120
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: booking-service
  ports:
    - port: 8082
      targetPort: 8082

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: booking-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
