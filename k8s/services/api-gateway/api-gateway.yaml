apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: api-gateway
          image: toyrental/api-gateway:1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis.infra.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: TOY_SERVICE_URL
              value: http://toy-service.toy-rental.svc.cluster.local:8081
            - name: BOOKING_SERVICE_URL
              value: http://booking-service.toy-rental.svc.cluster.local:8082
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak.infra.svc.cluster.local:8080/realms/toyrental
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-log-level
                  key: LOG_LEVEL
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-jvm-opts
                  key: JAVA_TOOL_OPTIONS
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
