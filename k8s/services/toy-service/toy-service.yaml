# Secrets are namespace-scoped, so this mirrors (not references) the relevant
# keys from infra's postgres-secret/couchbase-secret — same dev-only values,
# just duplicated into toy-rental so toy-service's Pod can mount them.
apiVersion: v1
kind: Secret
metadata:
  name: toy-service-secret
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: toy-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  POSTGRES_PASSWORD: toypass
  COUCHBASE_PASSWORD: password
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin

---
# Applies to every @KafkaListener in this service (one shared container factory) —
# there's only one consumer group here (toy-service-cg), so this is also effectively
# that group's concurrency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: toy-service-config
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: toy-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
data:
  KAFKA_LISTENER_CONCURRENCY: "1"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toy-service
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: toy-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: toy-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toy-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: toy-service
          image: toyrental/toy-service:1.0.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_HOST
              value: postgres.infra.svc.cluster.local
            - name: POSTGRES_USER
              value: toyuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: POSTGRES_PASSWORD
            - name: COUCHBASE_CONNECTION_STRING
              value: couchbase://couchbase.infra.svc.cluster.local
            - name: COUCHBASE_USERNAME
              value: Administrator
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: COUCHBASE_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.infra.svc.cluster.local:9092
            - name: KAFKA_LISTENER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: toy-service-config
                  key: KAFKA_LISTENER_CONCURRENCY
            - name: BOOKING_SERVICE_JWK_SET_URI
              value: http://booking-service.toy-rental.svc.cluster.local:8082/oauth2/jwks
            - name: MINIO_ENDPOINT
              value: http://minio.infra.svc.cluster.local:9000
            # No MINIO_PUBLIC_ENDPOINT override here — the localhost:9000 default in
            # application.yml is correct for wherever the frontend/browser actually runs,
            # via `kubectl port-forward svc/minio 9000:9000`. The in-cluster DNS name above
            # is only for toy-service's own upload connection, never resolvable from a browser.
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: MINIO_SECRET_KEY
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-log-level
                  key: LOG_LEVEL
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-jvm-opts
                  key: JAVA_TOOL_OPTIONS
            # New Relic APM agent. JDK_JAVA_OPTIONS is a separate JVM-native env var
            # (read alongside JAVA_TOOL_OPTIONS above, not instead of it) so this stays
            # independent of that ConfigMap's own documented purpose (JVM heap-tuning,
            # deliberately left empty until proven necessary by JMeter/JFR analysis).
            # Two earlier key values were rejected as "Invalid license key" and caused
            # the agent to retry in a tight ~12/sec loop instead of backing off — a real
            # resource incident on this node (see PROGRESS.md/git history). Confirmed
            # this time against the account's actual API keys page before reapplying.
            - name: JDK_JAVA_OPTIONS
              value: -javaagent:/app/newrelic.jar
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-secret
                  key: NEW_RELIC_LICENSE_KEY
            - name: NEW_RELIC_APP_NAME
              value: toy-service
            - name: NEW_RELIC_LOG_FILE_PATH
              value: STDOUT
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 150
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: toy-service
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: toy-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: toy-service
  ports:
    - port: 8081
      targetPort: 8081

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: toy-service
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: toy-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: toy-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
