# Shared across all 3 app services (api-gateway, toy-service, booking-service) — one
# New Relic account license key covers the whole stack, apps distinguished from each
# other via NEW_RELIC_APP_NAME set per-Deployment instead.
#
# Unlike this repo's other dev-only placeholder secrets (Couchbase, MinIO, Postgres —
# throwaway values with no meaning outside this local cluster), this key is tied to a
# real external New Relic account. The placeholder below is what's committed to git;
# the real value is applied directly to the live cluster out-of-band
# (kubectl create/patch secret), never written to a file in this repo. Replace the
# placeholder here only if you intend this file to stay a template, not a real secret.
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-secret
  namespace: toy-rental
  labels:
    app.kubernetes.io/name: newrelic
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  NEW_RELIC_LICENSE_KEY: "REPLACE_WITH_REAL_NEW_RELIC_LICENSE_KEY"
