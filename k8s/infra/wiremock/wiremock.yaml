---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremock
  namespace: infra
  labels:
    app.kubernetes.io/name: wiremock
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wiremock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiremock
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.5.4
          args: ["--port", "9090", "--global-response-templating"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
          readinessProbe:
            httpGet:
              path: /__admin/mappings
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /__admin/mappings
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: mappings
          configMap:
            name: wiremock-mappings

---
apiVersion: v1
kind: Service
metadata:
  name: wiremock
  namespace: infra
  labels:
    app.kubernetes.io/name: wiremock
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: wiremock
  ports:
    - port: 9090
      targetPort: 9090
