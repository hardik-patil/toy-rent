apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-mappings
  namespace: infra
  labels:
    app.kubernetes.io/name: wiremock
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
data:
  razorpay-order-stub.json: |
    {
      "request": {
        "method": "POST",
        "urlPath": "/v1/orders"
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": {
          "id": "order_mock123",
          "status": "created",
          "amount": 199900,
          "currency": "INR",
          "receipt": "bkg-00291"
        }
      }
    }
  razorpay-verify-stub.json: |
    {
      "request": {
        "method": "POST",
        "urlPath": "/v1/payments/verify"
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": {
          "razorpay_payment_id": "pay_mock456",
          "razorpay_order_id": "order_mock123",
          "razorpay_signature": "mock_signature_abc"
        }
      }
    }
  whatsapp-stub.json: |
    {
      "request": {
        "method": "POST",
        "urlPath": "/whatsapp/send"
      },
      "response": {
        "status": 200,
        "headers": {
          "Content-Type": "application/json"
        },
        "jsonBody": {
          "messageId": "wamid.mock789",
          "status": "sent"
        }
      }
