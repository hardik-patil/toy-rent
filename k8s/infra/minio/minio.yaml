apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: infra
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: infra
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-secret
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: infra
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
  clusterIP: None

---
# Same "mc mb --ignore-existing" bucket bootstrap as docker-compose's minio-init
# sidecar container.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: infra
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/mc:latest
          envFrom:
            - secretRef:
                name: minio-secret
          command:
            - /bin/sh
            - -c
            - >
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/toy-rental-reports
