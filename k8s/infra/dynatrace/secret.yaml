# Dev-only placeholder tokens. Never reuse for a real deployment — generate real
# apiToken/dataIngestToken values from Dynatrace (Access Tokens page, scopes:
# "Access problem and event feed, metrics, and topology" + "Ingest metrics" as a
# minimum for applicationMonitoring) and override via --set or a separate,
# untracked values file, same convention as helm/values.yaml's secrets block.
apiVersion: v1
kind: Secret
metadata:
  name: dynakube-tokens
  namespace: dynatrace
  labels:
    app.kubernetes.io/name: dynakube-tokens
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  apiToken: "REPLACE_WITH_REAL_DYNATRACE_API_TOKEN"
  dataIngestToken: "REPLACE_WITH_REAL_DYNATRACE_DATA_INGEST_TOKEN"
