# Binds OneAgent injection to the toy-rental namespace via the Dynatrace Operator's
# mutating webhook. No Deployment/Helm template needs editing — any pod in a namespace
# matching spec.oneAgent.applicationMonitoring.namespaceSelector below gets an
# "install-oneagent" init container plus oneagent-share/oneagent-share-log volumes
# injected automatically on creation.
#
# Prerequisite: the Dynatrace Operator (CRDs + webhook), installed WITHOUT the CSI
# driver (kubernetes.yaml, not kubernetes-csi.yaml — see STARTUP.md), must already be
# installed. The apiVersion below must match the CRD version registered by that
# operator release; verify with `kubectl explain dynakube --recursive` at install time
# against https://github.com/Dynatrace/dynatrace-operator/releases.
#
# spec.apiUrl and the tokens in secret.yaml are dev-only placeholders. Until replaced
# with a real Dynatrace tenant URL + tokens, `kubectl get dynakube -n dynatrace` will
# report a connectivity/auth error in status — expected, and does not block injection.
#
# initResources bounds the per-pod injected init container's own footprint. Left
# unset, Dynatrace applies no cap at all on this container — a real risk on this node
# given its history of memory-pressure freezes (see CLAUDE.md's Known Bugs table),
# especially since a restart of the app Deployments triggers several of these at once.
apiVersion: dynatrace.com/v1beta6
kind: DynaKube
metadata:
  name: toy-rental-oneagent
  namespace: dynatrace
  labels:
    app.kubernetes.io/name: toy-rental-oneagent
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  apiUrl: "https://ENVIRONMENT_ID.live.dynatrace.com/api"
  tokens: dynakube-tokens
  oneAgent:
    applicationMonitoring:
      namespaceSelector:
        matchLabels:
          dynatrace-injection: "enabled"
      initResources:
        requests:
          cpu: 50m
          memory: 50Mi
        limits:
          cpu: 300m
          memory: 200Mi
