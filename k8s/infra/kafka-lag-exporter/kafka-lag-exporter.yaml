apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-lag-exporter-config
  namespace: infra
  labels:
    app.kubernetes.io/name: kafka-lag-exporter
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
data:
  # This is broker-side lag (compares committed offsets against each partition's actual
  # log-end-offset via the Kafka admin client) — complements, doesn't replace, the
  # client-side kafka_consumer_fetch_manager_records_lag_max already scraped from the JVMs
  # (see prometheus.yaml's existing KafkaConsumerLagHigh alert). Broker-side keeps working
  # even if the consuming app itself is down/unhealthy, which client-side metrics can't.
  application.conf: |
    kafka-lag-exporter {
      port = 8000
      poll-interval = 30 seconds
      clusters = [
        {
          name = "toy-rental-kafka"
          bootstrap-brokers = "kafka.infra.svc.cluster.local:9092"
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-lag-exporter
  namespace: infra
  labels:
    app.kubernetes.io/name: kafka-lag-exporter
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-lag-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-lag-exporter
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: kafka-lag-exporter
          image: seglo/kafka-lag-exporter:0.8.2
          # Image has no ENTRYPOINT, only CMD (["/opt/docker/bin/kafka-lag-exporter",
          # "-Dconfig.file=...", "-Dlogback.configurationFile=..."]) — k8s `args:` alone
          # replaces CMD wholesale rather than appending, so `command:` must be set too.
          command: ["/opt/docker/bin/kafka-lag-exporter"]
          args: ["-Dconfig.file=/opt/docker/conf/application.conf"]
          ports:
            - containerPort: 8000
          volumeMounts:
            # subPath, not a full directory mount — mounting the ConfigMap over the whole
            # /opt/docker/conf directory would hide the image's bundled logback.xml.
            - name: config
              mountPath: /opt/docker/conf/application.conf
              subPath: application.conf
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: kafka-lag-exporter-config

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-lag-exporter
  namespace: infra
  labels:
    app.kubernetes.io/name: kafka-lag-exporter
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: kafka-lag-exporter
  ports:
    - port: 8000
      targetPort: 8000
