apiVersion: v1
kind: Secret
metadata:
  name: couchbase-secret
  namespace: infra
  labels:
    app.kubernetes.io/name: couchbase
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  COUCHBASE_USERNAME: Administrator
  COUCHBASE_PASSWORD: password

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: couchbase
  namespace: infra
  labels:
    app.kubernetes.io/name: couchbase
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: couchbase
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: couchbase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: couchbase
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
        - name: couchbase
          image: couchbase/server:community-7.2.4
          ports:
            - containerPort: 8091
            - containerPort: 8092
            - containerPort: 8093
            - containerPort: 8094
            - containerPort: 8095
            - containerPort: 8096
            - containerPort: 11210
          volumeMounts:
            - name: couchbase-data
              mountPath: /opt/couchbase/var
          # Resolved: this was never a cgroup/Erlang detection bug (that was the working
          # theory for a while, given it OOMKilled within seconds at 1Gi/2Gi/4Gi limits
          # regardless of raising the whole node's memory from 8GB to 12GB). It was
          # simpler than that — Couchbase Server's real baseline footprint on this setup
          # (Erlang VM + ns_server + indexer/query init, on top of the 256+256MB
          # configured service quotas) is genuinely ~4.85Gi, confirmed via `kubectl top
          # pod` once it was finally given enough room to boot. 4Gi was just under that
          # threshold, so every attempt died at a similar point in startup regardless of
          # the exact limit tried, which looked like a hard ceiling but wasn't. Verified
          # stable (Ready, no restarts, steady ~4.85Gi usage) at both 8Gi and 6Gi limits;
          # 6Gi is kept as the real value for reasonable headroom without being wasteful.
          resources:
            requests:
              cpu: 250m
              memory: 3Gi
            limits:
              cpu: 1500m
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /ui/index.html
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          # Couchbase Server's own internal startup is slow and was observed live to
          # sometimes exceed 60s — a liveness probe that fires before it's actually up
          # kills the container mid-startup, which restarts it, which never lets it
          # finish starting: a classic liveness-probe death spiral (confirmed via
          # `kubectl describe pod` showing 5+ restarts, each killed by "Liveness probe
          # failed" a few seconds after the container was created). Generous initialDelay
          # + failureThreshold gives it real room; readinessProbe still gates traffic
          # long before this would ever fire under normal operation.
          livenessProbe:
            httpGet:
              path: /ui/index.html
              port: 8091
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: couchbase-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: couchbase
  namespace: infra
  labels:
    app.kubernetes.io/name: couchbase
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: couchbase
  ports:
    - name: mgmt
      port: 8091
    - name: mgmt-ssl
      port: 8092
    - name: views
      port: 8093
    - name: query
      port: 8094
    - name: search
      port: 8095
    - name: eventing
      port: 8096
    - name: kv
      port: 11210
  clusterIP: None

---
# One-shot cluster + bucket provisioning, replacing docker-compose's manual
# "create the cluster and buckets via the web console" step (noted in
# docker-compose.yml's couchbase comment) so a fresh K8s deploy is smoke-
# testable without a human clicking through the UI. Safe to re-run: cluster-init
# fails harmlessly against an already-initialized node, bucket-create likewise
# against an existing bucket — both are swallowed so the Job still exits 0.
apiVersion: batch/v1
kind: Job
metadata:
  name: couchbase-init
  namespace: infra
  labels:
    app.kubernetes.io/name: couchbase-init
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/part-of: toy-rental
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: couchbase-init
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/part-of: toy-rental
        app.kubernetes.io/managed-by: kubectl
    spec:
      restartPolicy: OnFailure
      containers:
        - name: couchbase-init
          image: couchbase/server:community-7.2.4
          env:
            - name: CB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: couchbase-secret
                  key: COUCHBASE_USERNAME
            - name: CB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchbase-secret
                  key: COUCHBASE_PASSWORD
          command:
            - /bin/bash
            - -c
            - |
              set -e
              until curl -sf http://couchbase:8091/ui/index.html > /dev/null; do
                echo "waiting for couchbase..."; sleep 5
              done

              # This --cluster-ramsize is the data SERVICE's soft cache quota, not the
              # container's actual memory ceiling (that's set separately as the container
              # resources below, and unrelated — Couchbase's own process footprint of
              # ~4.85Gi is fixed overhead regardless of this number). 256MB previously left
              # too little room for all three buckets (3 x 100MB > 256MB), so the third
              # bucket-create silently failed with "ramQuota ... too large" and got
              # misreported by this script's fallback as "already exists" — confirmed live
              # once cluster-init/bucket-create could finally run against a stable
              # couchbase-0. 512MB comfortably fits all three with room to spare.
              # cluster-init only applies these quotas on a brand-new cluster — on a
              # cluster that's already initialized (any re-run of this Job) it just
              # errors and leaves the existing quota untouched, so setting-cluster is
              # needed too to make a ramsize bump actually take effect on a re-run.
              couchbase-cli cluster-init -c couchbase:8091 \
                --cluster-username "$CB_USERNAME" --cluster-password "$CB_PASSWORD" \
                --cluster-ramsize 512 --cluster-index-ramsize 256 \
                --services data,index,query || {
                  echo "cluster already initialized, updating quota instead"
                  couchbase-cli setting-cluster -c couchbase:8091 \
                    -u "$CB_USERNAME" -p "$CB_PASSWORD" \
                    --cluster-ramsize 512 --cluster-index-ramsize 256
                }

              for bucket in toy-availability logical-date monthly-reports; do
                couchbase-cli bucket-create -c couchbase:8091 \
                  -u "$CB_USERNAME" -p "$CB_PASSWORD" \
                  --bucket "$bucket" --bucket-type couchbase \
                  --bucket-ramsize 100 || echo "bucket-create for $bucket failed (already exists, or another real error — check logs above)"
              done
