name: toy-rental

services:

  postgres:
    image: postgres:15
    container_name: toyrental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toyrental-net

  couchbase:
    image: couchbase/server:community-7.2.4
    container_name: toyrental-couchbase
    restart: unless-stopped
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
      - "11207:11207"
      - "18091-18096:18091-18096"
    volumes:
      - couchbase_data:/opt/couchbase/var
    networks:
      - toyrental-net
    # NOTE: this image only starts the Couchbase Server process — the cluster and the
    # toy-availability / logical-date / monthly-reports buckets must be created once via
    # the web console at http://localhost:8091 (or the REST/CLI API) after first startup.

  kafka:
    # bitnami/kafka:3.7 was pulled from Docker Hub in Bitnami's Aug-2025 catalog restructuring
    # (the whole bitnami/kafka repo now has zero free tags). apache/kafka:3.7.2 is the official
    # image at the same pinned 3.7.x line, KRaft-only, single-node — no ZooKeeper either way.
    image: apache/kafka:3.7.2
    container_name: toyrental-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - toyrental-net

  redis:
    image: redis:7-alpine
    container_name: toyrental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - toyrental-net

  minio:
    image: minio/minio:latest
    container_name: toyrental-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toyrental-net

  minio-init:
    image: minio/mc:latest
    container_name: toyrental-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/toy-rental-reports
      "
    networks:
      - toyrental-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: toyrental-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - toyrental-net

  wiremock:
    image: wiremock/wiremock:3.5.4
    container_name: toyrental-wiremock
    restart: unless-stopped
    command: ["--port", "9090", "--global-response-templating"]
    ports:
      - "9090:9090"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    networks:
      - toyrental-net

  prometheus:
    image: prom/prometheus:latest
    container_name: toyrental-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - toyrental-net

  grafana:
    image: grafana/grafana:latest
    container_name: toyrental-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      # Dropping dashboard JSON into /var/lib/grafana/dashboards alone doesn't get it into
      # Grafana's UI — it needs a provisioning config telling it to load from that path, and a
      # datasource config so the dashboard's Prometheus queries resolve to something. Neither
      # existed before (the dashboards folder itself didn't even exist on disk).
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      # Host 3000 is already bound by a pre-existing Homebrew Grafana install unrelated
      # to this project (PID 987, running since before this session) — mapped to 3001
      # on the host instead of touching that service.
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - toyrental-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: toyrental-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - toyrental-net

networks:
  toyrental-net:
    driver: bridge

volumes:
  postgres_data:
  couchbase_data:
  kafka_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
