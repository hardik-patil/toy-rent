apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "api-gateway" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        {{- include "toy-rental.labels" (dict "name" "api-gateway" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: redis.{{ .Values.infraNamespace }}.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: TOY_SERVICE_URL
              value: http://toy-service.{{ .Values.namespace }}.svc.cluster.local:8081
            - name: BOOKING_SERVICE_URL
              value: http://booking-service.{{ .Values.namespace }}.svc.cluster.local:8082
            - name: KEYCLOAK_ISSUER_URI
              value: http://keycloak.{{ .Values.infraNamespace }}.svc.cluster.local:8080/realms/toyrental
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-log-level
                  key: LOG_LEVEL
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: toy-rental-jvm-opts
                  key: JAVA_TOOL_OPTIONS
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "api-gateway" "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

{{- if .Values.apiGateway.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "api-gateway" "root" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: {{ .Values.apiGateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.apiGateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiGateway.hpa.cpuUtilization }}
{{- end }}
