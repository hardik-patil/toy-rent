apiVersion: v1
kind: Secret
metadata:
  name: toy-service-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "toy-service" "root" $) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.toyServicePassword | quote }}
  COUCHBASE_PASSWORD: {{ .Values.secrets.couchbasePassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minio.secretKey | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toy-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "toy-service" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.toyService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: toy-service
  template:
    metadata:
      labels:
        {{- include "toy-rental.labels" (dict "name" "toy-service" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: toy-service
          image: "{{ .Values.toyService.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_HOST
              value: postgres.{{ .Values.infraNamespace }}.svc.cluster.local
            - name: POSTGRES_USER
              value: toyuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: POSTGRES_PASSWORD
            - name: COUCHBASE_CONNECTION_STRING
              value: couchbase://couchbase.{{ .Values.infraNamespace }}.svc.cluster.local
            - name: COUCHBASE_USERNAME
              value: Administrator
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: COUCHBASE_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.{{ .Values.infraNamespace }}.svc.cluster.local:9092
            - name: BOOKING_SERVICE_JWK_SET_URI
              value: http://booking-service.{{ .Values.namespace }}.svc.cluster.local:8082/oauth2/jwks
            - name: MINIO_ENDPOINT
              value: http://minio.{{ .Values.infraNamespace }}.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: toy-service-secret
                  key: MINIO_SECRET_KEY
            - name: ZIPKIN_ENDPOINT
              value: http://zipkin.{{ .Values.monitoringNamespace }}.svc.cluster.local:9411/api/v2/spans
          resources:
            {{- toYaml .Values.toyService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8081
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8081
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

---
apiVersion: v1
kind: Service
metadata:
  name: toy-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "toy-service" "root" $) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: toy-service
  ports:
    - port: 8081
      targetPort: 8081

{{- if .Values.toyService.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: toy-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "toy-rental.labels" (dict "name" "toy-service" "root" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: toy-service
  minReplicas: {{ .Values.toyService.hpa.minReplicas }}
  maxReplicas: {{ .Values.toyService.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.toyService.hpa.cpuUtilization }}
{{- end }}
