# Default values — mirrors CLAUDE.md's documented resource requests/limits,
# HPA config, and probe timings exactly. values-dev.yaml / values-prod.yaml
# override replica counts and HPA ranges for their respective environments;
# everything else (probe paths/timings, resource shape) stays constant across
# environments since CLAUDE.md doesn't document per-environment variants of
# those.

namespace: toy-rental
infraNamespace: infra
monitoringNamespace: monitoring

image:
  tag: "1.0.5"
  pullPolicy: IfNotPresent

apiGateway:
  replicas: 2
  image:
    repository: toyrental/api-gateway
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 60

toyService:
  replicas: 2
  image:
    repository: toyrental/toy-service
  kafka:
    # Applies to every @KafkaListener in this service (one shared container factory) —
    # there's only one consumer group here (toy-service-cg), so this is also
    # effectively that group's concurrency.
    listenerConcurrency: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuUtilization: 60

bookingService:
  replicas: 2
  image:
    repository: toyrental/booking-service
  kafka:
    # Applies to every @KafkaListener in this service (one shared container factory) —
    # all three consumer groups here (notification-cg, booking-internal-cg, report-cg)
    # share this same concurrency value, not independently tunable per group.
    listenerConcurrency: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuUtilization: 60

# initialDelaySeconds raised from 60/30 → 150/120: under CPU throttling on this
# dev node (single-node Docker Desktop k8s, no headroom), JVM startup can take
# 2+ minutes instead of the normal ~20s, and the tighter delays were killing
# pods (exit 137) mid-startup before Tomcat ever bound the port.
# Empty by default — see jvm-opts-config.yaml's comment. Set via --set jvmOpts="..."
# or here once you've got real values from your own JMeter/JFR analysis.
jvmOpts: ""

logging:
  # Shared across all 3 app services — DEBUG for sanity checks, ERROR during a load
  # test. Backs the toy-rental-log-level ConfigMap; see LOG_LEVEL in each Deployment.
  level: DEBUG

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 150
    periodSeconds: 15
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 120
    periodSeconds: 10

# Dev-only credentials matching docker-compose.yml's existing plaintext
# defaults (see application.yml's ${POSTGRES_PASSWORD:toypass} fallbacks).
# Never reuse for a real deployment — override via --set or a separate,
# untracked values file instead.
secrets:
  postgres:
    toyServicePassword: toypass
    bookingServicePassword: bookingpass
  couchbasePassword: password
  minio:
    accessKey: minioadmin
    secretKey: minioadmin
  admin:
    username: admin
    password: admin123
