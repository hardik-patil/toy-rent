server:
  port: 8081

spring:
  application:
    name: toy-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/toydb
    username: ${POSTGRES_USER:toyuser}
    password: ${POSTGRES_PASSWORD:toypass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Applies to every @KafkaListener in this service (one shared container factory,
      # see KafkaConsumerConfig) — there's only one consumer group here (toy-service-cg),
      # so this is also effectively that group's concurrency.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}
    consumer:
      group-id: toy-service-cg
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps JsonDeserializer so a malformed/unparseable record becomes a catchable
      # DeserializationException that DefaultErrorHandler can route through the normal
      # retry-then-DLT path, instead of a raw SerializationException thrown at Kafka's poll()
      # level — which DefaultErrorHandler explicitly cannot handle, and which bypasses retry
      # backoff entirely, causing the consumer to re-fetch and re-fail the same poison-pill
      # record as fast as the CPU allows (found live: a leftover headerless test message from
      # manual kafka-console-producer testing spun a consumer to 2.5M+ log lines in ~10s before
      # this fix).
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.toyrental.*"
        # Producers (booking-service) publish plain JSON with no __TypeId__ header — that header
        # would encode the producer's own class name (com.toyrental.booking.kafka.*) anyway, which
        # doesn't exist on this service's classpath. Deserialize by the envelope shape instead.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.toyrental.toy.kafka.BookingEventEnvelope
    producer:
      # used only to publish to *.DLT topics when a listener exhausts its retries
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # booking-service is this system's only token issuer (self-signed, see its
          # JwtKeyConfig) — no Keycloak realm was ever provisioned (CLAUDE.md's original
          # design), so validating against jwk-set-uri here rather than issuer-uri, fetching
          # the public key straight from booking-service instead of a Keycloak discovery
          # document that doesn't exist. See SecurityConfig's authority-extraction comment
          # for the matching claim-shape change this required.
          jwk-set-uri: ${BOOKING_SERVICE_JWK_SET_URI:http://localhost:8082/oauth2/jwks}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: toy-images

couchbase:
  connection-string: ${COUCHBASE_CONNECTION_STRING:couchbase://localhost}
  username: ${COUCHBASE_USERNAME:Administrator}
  password: ${COUCHBASE_PASSWORD:password}
  bucket:
    availability: toy-availability
    logical-date: logical-date

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} correlationId=%X{correlationId} traceId=%X{traceId} spanId=%X{spanId} - %msg%n"
  level:
    com.toyrental: ${LOG_LEVEL:DEBUG}
    org.springframework.kafka: INFO
